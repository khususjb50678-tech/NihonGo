<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Part — Admin</title><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="admin.css"><script src="admin_guard.js"></script><script src="admin_data.js"></script></head><body class="admin-shell"><header class="admin-top"><div class="admin-top-inner"><div><strong>Belajar Nihongo</strong><div style="font-size:10px;color:#cbd2df">ADMIN PANEL</div></div><div><a href="index.html" style="font-size:12px">← Website</a> <button class="btn" style="padding:7px 10px;font-size:11px" onclick="logoutAdmin()">Keluar</button></div></div></header><div class="admin-layout"><aside class="admin-side"><a href="admin_index.html">Dashboard</a><a href="admin_branding.html">Branding</a><a href="admin_kanji.html">Kanji</a><a class="active" href="admin_parts.html">Part</a><a href="admin_soal.html">Soal</a><a href="admin_user.html">User</a><a href="admin_hasil.html">Hasil</a></aside><main class="admin-main-card"><p class="eyebrow">ADMIN</p><h1>Kelola Part</h1><p>Atur Part, deskripsi, timer, dan status aktif.</p><div class="card"><h3 id="title">Tambah Part</h3><form id="form" class="admin-form"><div class="admin-grid"><label>Nomor<input id="number" type="number" min="1" required></label><label>Nama Part<input id="name" required></label><label>Deskripsi<input id="description"></label><label>Timer per soal (detik)<input id="timer" type="number" min="0" value="30"></label></div><label class="check"><input id="active" type="checkbox" checked> Tampilkan ke publik</label><button class="btn primary">Simpan Part</button> <button type="button" class="btn" id="cancel" style="display:none">Batal</button></form></div><div class="card"><h3>Daftar Part</h3><div id="list"></div></div></main></div><script>let editing=null,$=id=>document.getElementById(id);function render(){const a=BN.get('parts');$('list').innerHTML=a.length?a.map(x=>`<div class="data-row"><div><strong>PART ${String(x.number).padStart(2,'0')} · ${BN.esc(x.name)}</strong><small>${BN.esc(x.description||'')} · ${x.timer||0}s · ${x.active?'Aktif':'Nonaktif'}</small></div><div class="data-actions"><button class="btn" onclick="editP(${x.id})">Edit</button><button class="btn" onclick="toggleP(${x.id})">${x.active?'Nonaktifkan':'Aktifkan'}</button><button class="btn danger" onclick="delP(${x.id})">Hapus</button></div></div>`).join(''):'<p class="muted">Belum ada Part.</p>'}function reset(){editing=null;$('form').reset();$('number').value='';$('timer').value=30;$('active').checked=true;$('title').textContent='Tambah Part';$('cancel').style.display='none'}function editP(id){const x=BN.get('parts').find(v=>v.id===id);editing=id;$('number').value=x.number;$('name').value=x.name;$('description').value=x.description||'';$('timer').value=x.timer||0;$('active').checked=x.active;$('title').textContent='Edit Part';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}function toggleP(id){const a=BN.get('parts'),x=a.find(v=>v.id===id);if(x){x.active=!x.active;BN.set('parts',a);render()}}function delP(id){if(confirm('Hapus Part ini?')){BN.set('parts',BN.get('parts').filter(x=>x.id!==id));render()}}$('form').onsubmit=e=>{e.preventDefault();const a=BN.get('parts'),item={id:editing||BN.nextId(a),number:Number($('number').value),name:$('name').value.trim(),description:$('description').value.trim(),timer:Number($('timer').value)||0,active:$('active').checked};const i=a.findIndex(x=>x.id===item.id);if(i>=0)a[i]=item;else a.push(item);BN.set('parts',a);reset();render()};$('cancel').onclick=reset;render();</script></body></html>
