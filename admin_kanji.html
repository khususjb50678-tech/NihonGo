<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Kanji — Admin</title><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="admin.css"><script src="admin_guard.js"></script><script src="admin_data.js"></script></head>
<body class="admin-shell"><header class="admin-top"><div class="admin-top-inner"><div><strong>Belajar Nihongo</strong><div style="font-size:10px;color:#cbd2df">ADMIN PANEL</div></div><div style="display:flex;gap:10px;align-items:center"><a href="index.html" style="font-size:12px">← Website</a><button class="btn" style="padding:7px 10px;font-size:11px" onclick="logoutAdmin()">Keluar</button></div></div></header>
<div class="admin-layout"><aside class="admin-side"><a href="admin_index.html">Dashboard</a><a href="admin_branding.html">Branding</a><a class="active" href="admin_kanji.html">Kanji</a><a href="admin_parts.html">Part</a><a href="admin_soal.html">Soal</a><a href="admin_user.html">User</a><a href="admin_hasil.html">Hasil</a></aside>
<main class="admin-main-card"><p class="eyebrow">ADMIN</p><h1>Kelola Kanji</h1><p>Tambah, edit, aktif/nonaktifkan, dan hapus Kanji. Data tersimpan di browser ini sampai backend database dipasang.</p>
<div class="card"><h3 id="formTitle">Tambah Kanji</h3><form id="form" class="admin-form"><div class="admin-grid"><label>Kanji<input id="kanji" required></label><label>Koleksi<input id="collection" value="Dasar"></label><label>Hiragana / Kun’yomi<input id="kun"></label><label>Katakana / On’yomi<input id="on"></label><label>Romaji<input id="romaji"></label><label>Arti<input id="meaning" required></label></div><label>Catatan<textarea id="notes" rows="3"></textarea></label><label class="check"><input id="active" type="checkbox" checked> Aktif</label><div><button class="btn primary" type="submit" id="saveBtn">Simpan Kanji</button> <button class="btn" type="button" id="cancel" style="display:none">Batal</button></div></form></div>
<div class="card"><div class="admin-row"><h3>Daftar Kanji</h3><input id="search" placeholder="Cari kanji / arti..."></div><div id="list"></div></div></main></div>
<script>
let editing=null;const $=id=>document.getElementById(id);function render(){const q=$('search').value.toLowerCase();const data=BN.get('kanji').filter(x=>(x.kanji+x.meaning+x.romaji+x.kun+x.on).toLowerCase().includes(q));$('list').innerHTML=data.length?data.map(x=>`<div class="data-row"><div class="data-main"><b class="big-kanji">${BN.esc(x.kanji)}</b><div><strong>${BN.esc(x.meaning)}</strong><small>${BN.esc(x.collection)} · ${x.active?'Aktif':'Nonaktif'} · ${BN.esc(x.romaji)}</small></div></div><div class="data-actions"><button class="btn" onclick="editK(${x.id})">Edit</button><button class="btn" onclick="toggleK(${x.id})">${x.active?'Nonaktifkan':'Aktifkan'}</button><button class="btn danger" onclick="delK(${x.id})">Hapus</button></div></div>`).join(''):'<p class="muted">Belum ada data.</p>'}
function reset(){editing=null;$('form').reset();$('active').checked=true;$('formTitle').textContent='Tambah Kanji';$('saveBtn').textContent='Simpan Kanji';$('cancel').style.display='none'}function editK(id){const x=BN.get('kanji').find(v=>v.id===id);if(!x)return;editing=id;for(const k of ['kanji','collection','kun','on','romaji','meaning','notes'])$(k).value=x[k]||'';$('active').checked=!!x.active;$('formTitle').textContent='Edit Kanji';$('saveBtn').textContent='Update Kanji';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}function toggleK(id){const a=BN.get('kanji');const x=a.find(v=>v.id===id);if(x){x.active=!x.active;BN.set('kanji',a);render()}}function delK(id){if(!confirm('Hapus Kanji ini?'))return;BN.set('kanji',BN.get('kanji').filter(x=>x.id!==id));render()}$('form').onsubmit=e=>{e.preventDefault();const a=BN.get('kanji');const item={id:editing||BN.nextId(a),kanji:$('kanji').value.trim(),collection:$('collection').value.trim()||'Dasar',kun:$('kun').value.trim(),on:$('on').value.trim(),romaji:$('romaji').value.trim(),meaning:$('meaning').value.trim(),notes:$('notes').value.trim(),active:$('active').checked};const i=a.findIndex(x=>x.id===item.id);if(i>=0)a[i]=item;else a.push(item);BN.set('kanji',a);reset();render()};$('cancel').onclick=reset;$('search').oninput=render;render();
</script></body></html>
