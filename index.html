<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ITCO JAPAN — belajar bahasa Jepang dengan Kanji dan latihan interaktif"><meta name="theme-color" content="#050505"><title>ITCO JAPAN</title><link id="favicon" rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"><link rel="stylesheet" href="style.css"><style>
#splash{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2a0f14 0%,#0a0a0d 55%,#050505 100%);color:#fff;font-family:"Sora","Plus Jakarta Sans",system-ui,sans-serif;transition:opacity .5s ease,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash .splash-in{display:grid;justify-items:center;gap:14px;padding:24px;text-align:center}
#splash .splash-logo{position:relative;width:132px;height:132px;display:grid;place-items:center;animation:spPop .7s cubic-bezier(.2,.9,.25,1.2) both}
#splash .splash-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ff2d55,transparent 30%,#2d7bff 52%,transparent 80%,#ff2d55);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:spSpin 1.6s linear infinite;filter:drop-shadow(0 0 10px rgba(255,45,85,.5))}
#splash .splash-logo img{position:relative;display:block;width:108px;height:108px;border-radius:28px;object-fit:cover;background:#111;border:1px solid #2a2a33;box-sizing:border-box}
#splash .splash-name{font-size:clamp(26px,8vw,38px);font-weight:800;letter-spacing:.5px;animation:spUp .7s .25s ease both}
#splash .splash-sub{font-size:12px;letter-spacing:3px;color:#a9a9b4;text-transform:uppercase;min-height:16px;animation:spUp .7s .4s ease both}
#splash .splash-bar{width:170px;height:4px;border-radius:99px;background:#26262e;overflow:hidden;margin-top:10px;animation:spUp .7s .5s ease both}
#splash .splash-bar i{display:block;width:45%;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff2d55,#2d7bff);animation:spBar 1.25s ease-in-out infinite}
#splash .splash-load{font-size:12px;color:#8d8d99;letter-spacing:1px;animation:spUp .7s .6s ease both}
#splash.pending .splash-logo,#splash.pending .splash-name,#splash.pending .splash-sub{opacity:0;animation:none}
@keyframes spPop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01ms!important;animation-iteration-count:1!important}#splash .splash-bar i{width:100%}}
</style></head><body><div id="splash" role="status" aria-live="polite" aria-label="Memuat"><div class="splash-in"><div class="splash-logo"><span class="splash-ring"></span><img id="splashImg" alt="" src="favicon.svg"></div><div class="splash-name" id="splashName"></div><div class="splash-sub" id="splashSub"></div><div class="splash-bar"><i></i></div><div class="splash-load">Memuat…</div></div></div><script>(function(){var sp=document.getElementById('splash');window.__splashStart=Date.now();try{var b=JSON.parse(localStorage.getItem('itco_brand')||'null');if(b&&b.n){document.getElementById('splashName').textContent=b.n;document.getElementById('splashSub').textContent=b.c||'';var i=document.getElementById('splashImg');i.onerror=function(){i.onerror=null;i.src='favicon.svg'};if(b.l)i.src=b.l;}else{sp.className='pending'}}catch(e){sp.className='pending'}setTimeout(function(){var x=document.getElementById('splash');if(x)x.remove()},12000)})();</script><div id="app"></div><script type="module" src="app.js"></script></body></html>
