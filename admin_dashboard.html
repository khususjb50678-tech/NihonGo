<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Admin</title><link rel="stylesheet" href="main.css"><style>

:root{
  --bg:#070708;--bg2:#0c0c0f;--panel:#111114;--panel2:#151519;
  --line:#26262d;--text:#f7f7f8;--muted:#a2a2ab;--red:#e52a3d;
  --red2:#ff4054;--max:1120px;--shadow:0 20px 60px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
 radial-gradient(circle at 80% 0%,rgba(229,42,61,.10),transparent 30rem),
 radial-gradient(circle at 10% 35%,rgba(255,255,255,.035),transparent 24rem),
 var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.container{width:min(calc(100% - 32px),var(--max));margin:auto}
.topbar{position:sticky;top:0;z-index:20;min-height:72px;border-bottom:1px solid rgba(255,255,255,.08);
 background:rgba(7,7,8,.86);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:850;letter-spacing:.04em;white-space:nowrap}
.brand span{color:var(--red);font-size:18px}
.topbar nav{display:flex;gap:8px;font-size:12px;font-weight:750;color:#aaa}
.topbar nav a{padding:9px 12px;border-radius:9px}
.topbar nav a:hover{background:#16161a;color:#fff}
.hero{padding:92px 0 80px}
.eyebrow{color:#ff4a5d;font-size:11px;font-weight:850;letter-spacing:.18em;margin:0 0 12px}
.hero h1{font-size:clamp(48px,8vw,88px);line-height:.94;margin:0;letter-spacing:-.065em;max-width:900px}
.hero h1 span{color:#666872}
.lead{color:var(--muted);max-width:680px;font-size:17px;margin-top:24px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 76px}
.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:12px 17px;border-radius:11px;
 display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;transition:.18s transform,.18s border-color,.18s background}
.btn:hover{transform:translateY(-1px);border-color:#44444d}
.btn.primary{background:var(--red);border-color:var(--red);box-shadow:0 8px 30px rgba(229,42,61,.18)}
.btn.primary:hover{background:var(--red2);border-color:var(--red2)}
.btn.ghost{background:transparent}
.feature-grid,.list-grid,.kanji-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card,.panel,.result-card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));
 border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.card{transition:.2s transform,.2s border-color}
.card:hover{transform:translateY(-3px);border-color:#3a3a43}
.card b{color:var(--red2);font-size:12px;letter-spacing:.12em}
.card h3{margin:12px 0 5px;font-size:20px}
.card p{color:var(--muted);margin:0}
footer{border-top:1px solid var(--line);padding:28px;text-align:center;color:#666;font-size:12px}
.page{padding:58px 0}.page h1{font-size:clamp(36px,6vw,54px);margin:0 0 26px;letter-spacing:-.04em}
.auth{min-height:100vh;display:grid;place-items:center;padding:30px 16px}
.auth-card{width:min(100%,430px);padding:28px;border:1px solid var(--line);background:rgba(17,17,20,.92);border-radius:20px;box-shadow:var(--shadow)}
.auth-card h1{font-size:42px;margin:0 0 24px;letter-spacing:-.05em}
.auth-card form{display:grid;gap:16px}
label{display:grid;gap:7px;color:#bbb;font-size:13px;font-weight:650}
input{width:100%;background:#0b0b0e;border:1px solid #292930;border-radius:11px;padding:13px 14px;color:#fff;outline:none;transition:.18s}
input:focus{border-color:#555563;box-shadow:0 0 0 3px rgba(229,42,61,.08)}
.muted{color:var(--muted)}
.list-grid{grid-template-columns:repeat(2,1fr)}
.part-card{display:flex;justify-content:space-between;align-items:center;gap:20px}
.part-card h3{margin:0}.part-card p{color:var(--muted);margin:4px 0 0}
.kanji-grid{grid-template-columns:repeat(4,1fr)}
.kanji-card{text-align:center;min-height:190px}
.kanji-char{font-size:76px;line-height:1.1;margin:14px 0 10px}
.kanji-info{color:var(--muted);font-size:13px}
.kanji-controls{margin-bottom:20px;max-width:620px}
.error{color:#ff6b78;font-size:13px}.hidden{display:none!important}
.result-card{margin-bottom:20px}.score{font-size:64px;line-height:1;font-weight:950;margin:10px 0 25px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:15px;background:#0b0b0e;border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted);font-weight:750}
@media(max-width:700px){
 .topbar{padding:0 14px;min-height:64px}.topbar nav{gap:0}.topbar nav a{padding:8px 7px;font-size:10px}
 .brand{font-size:12px}.hero{padding:62px 0 55px}.hero h1{font-size:clamp(45px,15vw,68px)}
 .lead{font-size:15px}.actions{margin-bottom:50px}
 .feature-grid,.list-grid,.kanji-grid{grid-template-columns:1fr}.page{padding:42px 0}
 .part-card{align-items:flex-start;flex-direction:column}.part-card .btn{width:100%}
 .stat-row{grid-template-columns:repeat(2,1fr)}.auth-card{padding:22px}
}

</style></head><body><header class="topbar"><a class="brand" href="admin_dashboard.html">ADMIN · BELAJAR NIHONGO</a><nav><a href="index.html">WEBSITE</a><a href="admin_index.html">LOGOUT</a></nav></header><main class="container page"><p class="eyebrow">ADMIN</p><h1>Dashboard</h1><div class="feature-grid"><div class="card"><b>7</b><h3>Kanji Demo</h3><p>Total data contoh.</p></div><div class="card"><b>1</b><h3>Part Aktif</h3><p>Part yang tampil ke user.</p></div><div class="card"><b>3</b><h3>Soal Demo</h3><p>Soal latihan awal.</p></div></div><p class="muted">Panel CRUD lengkap (Kanji, Part, Soal, User, Hasil, Statistik, Pengaturan) akan memakai database pada tahap backend.</p></main></body></html>
