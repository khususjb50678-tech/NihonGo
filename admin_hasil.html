<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasil — Admin</title><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="admin.css"><script src="admin_guard.js"></script></head><body class="admin-shell"><header class="admin-top"><div class="admin-top-inner"><div><strong>Belajar Nihongo</strong><div style="font-size:10px;color:#cbd2df">ADMIN PANEL</div></div><div><a href="index.html" style="font-size:12px">← Website</a> <button class="btn" style="padding:7px 10px;font-size:11px" onclick="logoutAdmin()">Keluar</button></div></div></header><div class="admin-layout"><aside class="admin-side"><a href="admin_index.html">Dashboard</a><a href="admin_branding.html">Branding</a><a href="admin_kanji.html">Kanji</a><a href="admin_parts.html">Part</a><a href="admin_soal.html">Soal</a><a href="admin_user.html">User</a><a class="active" href="admin_hasil.html">Hasil</a></aside><main class="admin-main-card"><p class="eyebrow">ADMIN</p><h1>Hasil & Statistik</h1><p>Hasil latihan yang tersimpan di browser ini.</p><div id="stats" class="admin-grid"></div><div class="card"><h3>Riwayat</h3><div id="list"></div><button class="btn danger" onclick="if(confirm('Hapus semua hasil?')){localStorage.removeItem('bn_results');localStorage.removeItem('bn_last_result');location.reload()}">Hapus Semua</button></div></main></div><script>const a=JSON.parse(localStorage.getItem('bn_results')||'[]');const last=JSON.parse(localStorage.getItem('bn_last_result')||'null');const all=a.length?a:(last?[last]:[]);const avg=all.length?Math.round(all.reduce((s,x)=>s+(x.accuracy||0),0)/all.length):0;document.getElementById('stats').innerHTML=`<div class="admin-stat"><b>${all.length}</b><span>Total attempt</span></div><div class="admin-stat"><b>${avg}%</b><span>Akurasi rata-rata</span></div>`;document.getElementById('list').innerHTML=all.length?all.slice().reverse().map(x=>`<div class="data-row"><div><strong>${x.name||'Guest'}</strong><small>Score ${x.score||0} · ${x.correct||0}/${x.total||0} benar · Akurasi ${x.accuracy||0}%</small></div></div>`).join(''):'<p class="muted">Belum ada hasil.</p>';</script></body></html>
