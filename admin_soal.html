<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Soal — Admin</title><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="admin.css"><script src="admin_guard.js"></script><script src="admin_data.js"></script></head><body class="admin-shell"><header class="admin-top"><div class="admin-top-inner"><div><strong>Belajar Nihongo</strong><div style="font-size:10px;color:#cbd2df">ADMIN PANEL</div></div><div><a href="index.html" style="font-size:12px">← Website</a> <button class="btn" style="padding:7px 10px;font-size:11px" onclick="logoutAdmin()">Keluar</button></div></div></header><div class="admin-layout"><aside class="admin-side"><a href="admin_index.html">Dashboard</a><a href="admin_branding.html">Branding</a><a href="admin_kanji.html">Kanji</a><a href="admin_parts.html">Part</a><a class="active" href="admin_soal.html">Soal</a><a href="admin_user.html">User</a><a href="admin_hasil.html">Hasil</a></aside><main class="admin-main-card"><p class="eyebrow">ADMIN</p><h1>Kelola Soal</h1><p>Buat dan kelola soal pilihan ganda, isian, dan benar/salah.</p><div class="card"><h3 id="title">Tambah Soal</h3><form id="form" class="admin-form"><div class="admin-grid"><label>Tipe<select id="type"><option value="mc">Pilihan Ganda</option><option value="input">Isian / Ketik</option><option value="tf">Benar / Salah</option></select></label><label>Poin<input id="points" type="number" min="1" value="10"></label></div><label>Pertanyaan<textarea id="prompt" rows="3" required></textarea></label><label>Pilihan (khusus pilihan ganda, pisahkan dengan |)<input id="choices"></label><label>Jawaban benar<input id="answer" required></label><label>Penjelasan<textarea id="explanation" rows="3"></textarea></label><label class="check"><input id="active" type="checkbox" checked> Aktif</label><button class="btn primary">Simpan Soal</button> <button type="button" class="btn" id="cancel" style="display:none">Batal</button></form></div><div class="card"><h3>Daftar Soal</h3><div id="list"></div></div></main></div><script>let editing=null,$=id=>document.getElementById(id);function render(){const a=BN.get('questions');$('list').innerHTML=a.length?a.map(x=>`<div class="data-row"><div><strong>${BN.esc(x.type.toUpperCase())} · ${BN.esc(x.prompt)}</strong><small>Jawaban: ${BN.esc(x.answer)} · ${x.points} poin · ${x.active?'Aktif':'Nonaktif'}</small></div><div class="data-actions"><button class="btn" onclick="editQ(${x.id})">Edit</button><button class="btn" onclick="toggleQ(${x.id})">${x.active?'Nonaktifkan':'Aktifkan'}</button><button class="btn danger" onclick="delQ(${x.id})">Hapus</button></div></div>`).join(''):'<p class="muted">Belum ada soal.</p>'}function reset(){editing=null;$('form').reset();$('points').value=10;$('active').checked=true;$('title').textContent='Tambah Soal';$('cancel').style.display='none'}function editQ(id){const x=BN.get('questions').find(v=>v.id===id);editing=id;$('type').value=x.type;$('points').value=x.points;$('prompt').value=x.prompt;$('choices').value=(x.choices||[]).join(' | ');$('answer').value=x.answer;$('explanation').value=x.explanation||'';$('active').checked=x.active;$('title').textContent='Edit Soal';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}function toggleQ(id){const a=BN.get('questions'),x=a.find(v=>v.id===id);if(x){x.active=!x.active;BN.set('questions',a);render()}}function delQ(id){if(confirm('Hapus soal ini?')){BN.set('questions',BN.get('questions').filter(x=>x.id!==id));render()}}$('form').onsubmit=e=>{e.preventDefault();const a=BN.get('questions'),type=$('type').value,item={id:editing||BN.nextId(a),type,prompt:$('prompt').value.trim(),choices:type==='mc'?$('choices').value.split('|').map(s=>s.trim()).filter(Boolean):type==='tf'?['Benar','Salah']:[],answer:$('answer').value.trim(),points:Number($('points').value)||10,explanation:$('explanation').value.trim(),active:$('active').checked};const i=a.findIndex(x=>x.id===item.id);if(i>=0)a[i]=item;else a.push(item);BN.set('questions',a);reset();render()};$('cancel').onclick=reset;render();</script></body></html>
