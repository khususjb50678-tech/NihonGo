<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin — Belajar Nihongo</title>
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="admin.css">
<style>
.login-admin-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:#f5f7fb}
.login-admin-card{width:min(100%,430px);background:#fff;border:1px solid #e1e5ec;border-radius:22px;padding:24px;box-shadow:0 14px 40px rgba(23,32,51,.08)}
.login-admin-card .admin-logo{width:54px;height:54px;border-radius:16px;background:#172033;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;margin-bottom:14px}
.login-admin-card h1{margin:0 0 6px;font-size:29px}.login-admin-card>p{color:#707887;font-size:13px;margin:0 0 20px}
.login-admin-form{display:grid;gap:14px}.login-admin-form label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#555d68}.login-admin-form input{width:100%;padding:12px;border:1px solid #dfe3ea;border-radius:11px;outline:none}.login-admin-form input:focus{border-color:#ef233c}
.login-note{margin-top:16px;padding:12px;border-radius:12px;background:#fff5f6;color:#6c4650;font-size:11px;line-height:1.5}.login-error{min-height:18px;color:#d71932;font-size:12px;font-weight:700}
</style>
</head>
<body>
<main class="login-admin-wrap">
<section class="login-admin-card">
<div class="admin-logo">日</div>
<p class="eyebrow">AREA TERLINDUNGI</p>
<h1>Login Admin</h1>
<p>Masuk untuk mengelola Branding, Kanji, Part, Soal, User, dan Hasil.</p>
<form id="adminLogin" class="login-admin-form">
<label>Email Admin<input id="email" type="email" autocomplete="username" placeholder="Email admin" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password" required></label>
<button class="btn primary" type="submit">MASUK KE ADMIN</button>
<div id="loginError" class="login-error"></div>
</form>
<div class="login-note"><b>Catatan:</b> login ini masih mode demo karena website sekarang memakai GitHub Pages statis. Untuk keamanan produksi, autentikasi harus dipindahkan ke backend seperti Supabase.</div>
<p class="muted" style="font-size:12px;margin:16px 0 0"><a href="index.html">← Kembali ke website</a></p>
</section>
</main>
<script src="admin.js"></script>
</body></html>
